---
services:
  mongo:
    image: mongo:7.0.12
    container_name: mongo
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
      - MONGO_INITDB_DATABASE=portal-app
    ports:
      - '27017:27017'
    command: mongod --bind_ip_all
    volumes:
      - dbdata:/data/db
  redis:
    image: redis:7.2.5
    container_name: redis
    restart: unless-stopped
    env_file: .env
    ports:
      - '6379:6379'
    command: redis-server --bind localhost --bind 0.0.0.0 --save 20 1 --loglevel warning --requirepass redispassword
    volumes:
      - cache:/data/cache

volumes:
  dbdata:
  cache:
